<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eudaimonia</title>

    <meta name="theme-color" content="#1a2e4a" />

    <!-- MediaPipe FaceMesh, served from our own origin (copied out of
         node_modules into public/mediapipe by scripts/copy-mediapipe.mjs).
         Not a CDN: the app must work offline and behind content blockers, and
         "nothing leaves your device" has to be true of the model download too.
         camera_utils is deliberately absent — the app drives the webcam itself
         (see createCameraController) so it can recover from a dead MediaStream
         and never shows MediaPipe's raw alert() dialog on a camera error. -->
    <script src="./mediapipe/face_mesh.js"></script>
    <script type="module" crossorigin src="./assets/main-CxdJip_v.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/attention-Cd6GtIYc.js">
    <link rel="stylesheet" crossorigin href="./assets/main-BHOBls1T.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister())
          })
        })
      }
    </script>
  </body>
</html>
