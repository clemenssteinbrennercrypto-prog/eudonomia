[package]
name = "eudonomia-companion"
version = "0.1.0"
description = "Eudonomia menubar companion — activity tracking for the focus tracker"
edition = "2021"
default-run = "eudonomia-companion"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
mediapipe = "0.1.0"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
dispatch2 = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }

[profile.release]
strip = true
lto = true
