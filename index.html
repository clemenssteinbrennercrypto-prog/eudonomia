<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eudaimonia</title>

    <meta name="theme-color" content="#1a2e4a" />

    <!-- MediaPipe FaceMesh. camera_utils is deliberately NOT loaded: the app
         drives the webcam itself (see createCameraController) so it can detect
         and recover from a dead MediaStream, and never shows MediaPipe's raw
         alert() dialog on a camera error. -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister())
          })
        })
      }
    </script>
  </body>
</html>
