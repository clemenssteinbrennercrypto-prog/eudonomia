<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; padding: 16px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F4F0; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    h3 { margin: 0 0 4px; font-size: 14px; color: #1a2e4a; }
    p { margin: 0; font-size: 12px; color: #6b7280; }
    .url { font-size: 11px; color: #64748b; margin-top: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="status">
    <div class="dot"></div>
    <div>
      <h3>Eudonomia Active</h3>
      <p>Tracking your focus</p>
    </div>
  </div>
  <div class="url" id="current-url">Loading...</div>
  <script src="popup.js"></script>
</body>
</html>
