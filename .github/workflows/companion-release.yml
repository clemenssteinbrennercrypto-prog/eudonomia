name: Release Companion

# Production-only Companion pipeline. Builds a signed Apple Silicon macOS app,
# notarizes and staples the DMG, verifies Gatekeeper acceptance, then publishes
# the release used by the native updater.

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the release-v prefix'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check preinstalled Node.js
        run: |
          node --version
          npm --version

      - name: Install web dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri

      - name: Validate release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release secret(s): %s\n' "${missing[*]}" >&2
            printf 'Refusing to publish an unsigned or unnotarized macOS build.\n' >&2
            exit 1
          fi

      - name: Set release build identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#release-v}"
          else
            version="${INPUT_VERSION}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be semver-like: $version" >&2
            exit 1
          fi

          python3 - <<PY
          import json
          p = 'companion/src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d['version'] = '${version}'
          json.dump(d, open(p, 'w'), indent=2)
          print('version set to', d['version'])
          PY

          {
            echo "EUDONOMIA_BUILD_VERSION=$version"
            echo "EUDONOMIA_BUILD_CHANNEL=release"
            echo "EUDONOMIA_BUILD_ID=release-v$version-${GITHUB_SHA::7}"
            echo "EUDONOMIA_BUILD_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Refresh bundled companion UI
        run: npm run refresh:companion-webui

      - name: Verify bundled companion UI
        run: npm run verify:companion-webui

      - id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tagName: release-v__VERSION__
          releaseName: 'Eudonomia v__VERSION__'
          releaseBody: |
            Download the macOS `.dmg` asset to install Eudonomia.

            The `.app.tar.gz`, `.sig`, and `latest.json` assets are for the signed Tauri updater, not manual installation.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: '[name]-[version]-[arch][ext]'
          args: --target aarch64-apple-darwin --verbose --config src-tauri/tauri.release.conf.json

      - name: Verify signed and notarized macOS artifacts
        run: |
          set -euo pipefail

          bundle_root="companion/src-tauri/target/aarch64-apple-darwin/release/bundle"

          app_count=0
          while IFS= read -r app; do
            app_count=$((app_count + 1))
            codesign --verify --deep --strict --verbose=2 "$app"
            /usr/sbin/spctl --assess --type execute --verbose=4 "$app"
          done < <(find "$bundle_root" -name '*.app' -type d)

          if [ "$app_count" -eq 0 ]; then
            echo "No .app bundle found under $bundle_root" >&2
            exit 1
          fi

          dmg_count=0
          while IFS= read -r dmg; do
            dmg_count=$((dmg_count + 1))
            xcrun stapler validate "$dmg"
            /usr/sbin/spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done < <(find "$bundle_root" -name '*.dmg' -type f)

          if [ "$dmg_count" -eq 0 ]; then
            echo "No .dmg found under $bundle_root" >&2
            exit 1
          fi

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri-build.outputs.appVersion }}
        run: |
          set -euo pipefail
          gh release edit "release-v${VERSION}" --draft=false --latest
